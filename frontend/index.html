<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1f24" />
    <title>Lookout</title>
    <meta name="description" content="Lookout (Station Egg Hunt): find what's hiding in your MBTA station before the timer runs out." />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="hud" class="hud" hidden></header>

    <main id="app" aria-live="polite"></main>

    <nav class="tabs" id="tabs" aria-label="Main" hidden>
      <a href="#/" data-tab="here">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z" /><circle cx="12" cy="9.5" r="2.5" /></svg>
        Here
      </a>
      <a href="#/map" data-tab="map">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14" /></svg>
        Map
      </a>
      <a href="#/leaderboard" data-tab="leaderboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20v-7h4v7M10 20V5h4v15M16 20v-10h4v10" /></svg>
        Ranks
      </a>
      <a href="#/groups" data-tab="groups">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3" /><circle cx="17" cy="10" r="2.3" /><path d="M3.5 19.5c.7-3.3 2.9-5 5.5-5s4.8 1.7 5.5 5M15.2 14.6c2.4-.2 4.3 1.3 5.1 4.2" /></svg>
        Groups
      </a>
      <a href="#/profile" data-tab="profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5" /><path d="M5 20c.8-3.8 3.6-5.8 7-5.8s6.2 2 7 5.8" /></svg>
        Profile
      </a>
    </nav>

    <div id="toast" class="toast" role="status" hidden></div>
    <script src="config.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
