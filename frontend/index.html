<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14161a" />
    <title>Station Egg Hunt</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="#/" class="brand"><img src="icon.svg" alt="" width="26" height="26" /> Station Egg Hunt</a>
      <span id="me" class="me"></span>
    </header>

    <main id="app" aria-live="polite"></main>

    <nav class="tabs" id="tabs" aria-label="Main">
      <a href="#/" data-tab="stations">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v12H5zM8 20l1.5-2M16 20l-1.5-2M5 11h14" /><circle cx="8.5" cy="14" r=".8" /><circle cx="15.5" cy="14" r=".8" /></svg>
        Stations
      </a>
      <a href="#/map" data-tab="map">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14" /></svg>
        Map
      </a>
      <a href="#/leaderboard" data-tab="leaderboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V12h4v8M10 20V6h4v14M16 20v-5h4v5" /></svg>
        Leaderboard
      </a>
      <a href="#/profile" data-tab="profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" /></svg>
        Profile
      </a>
    </nav>

    <div id="toast" class="toast" role="status" hidden></div>
    <script src="config.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
